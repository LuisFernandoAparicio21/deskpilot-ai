name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Pytest with coverage
        run: pytest --cov=src --cov-report=term-missing

  eval-smoke:
    name: Eval smoke (local mode, real index)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The fastembed model (~240 MB) is downloaded once by `index` into this folder
      # (embeddings.cache_dir). The key follows config.yaml, where the model name lives.
      - name: Cache the fastembed model
        uses: actions/cache@v6
        with:
          path: data/vectordb/models
          key: fastembed-${{ runner.os }}-${{ hashFiles('config.yaml') }}

      - name: Generate data, load the database and build the index
        run: |
          python main.py generate-data
          python main.py load-db
          python main.py index

      # `main.py eval` exit-code contract (docs/features/eval-e2e.md): 0 = every target met;
      # 3 = global minimum and security hold, but a target is unmet or a documented known
      # failure (config.yaml eval.known_failures) failed; 1 = regression (minimum, security or
      # a new failure); 2 = configuration/CSV/DB/index/API error. Only 0 and 3 pass the job.
      # Exit 3 is never hidden: the unmet criteria are printed as a ::warning:: annotation.
      - name: Run the 30 evaluation cases
        run: |
          set +e
          python main.py eval
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then
            echo "::error::main.py eval exited with $code (only 0 or 3 are accepted)"
            exit "$code"
          fi
          python - <<'PY'
          import json

          s = json.load(open("tests/eval/results.summary.json", encoding="utf-8"))
          unmet = [
              f"{k} {c['actual']}% < {c['target']}%"
              for k, c in s["criteria"].items()
              if not c["met"]
          ]
          if unmet or s["known_failures_hit"] or s["new_failures"]:
              print(
                  f"::warning title=eval: {s['exit_reason']}::unmet criteria: "
                  f"{'; '.join(unmet) or 'none'}. known failures: "
                  f"{', '.join(s['known_failures_hit']) or 'none'}. new failures: "
                  f"{', '.join(s['new_failures']) or 'none'}."
              )
          PY

      - name: Upload the evaluation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: |
            tests/eval/results.csv
            tests/eval/results.summary.json
          if-no-files-found: warn
          retention-days: 14

  docker-build:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: deskpilot-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
