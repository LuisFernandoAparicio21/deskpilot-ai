# Configuración de DeskPilot AI (sin secretos).
# Los secretos y las credenciales viven en .env (ver .env.example).
# T8 valida este archivo con Pydantic al arrancar: si falta algo, falla con un mensaje claro (S17).

# --- Aplicación ---
app:
  name: deskpilot-ai
  mode: local            # local | fabric. Se puede sobrescribir con DESKPILOT_MODE.
  log_level: INFO        # DEBUG | INFO | WARNING | ERROR

# --- Rutas (relativas a la raíz del repo) ---
paths:
  knowledge_base: data/knowledge_base   # 15 artículos .md (se versionan)
  sample: data/sample                   # 200 tickets de muestra (se versionan)
  raw: data/raw                         # CSV completo de tickets (ignorado por git)
  sqlite_db: data/deskpilot.db          # base SQLite del modo local (ignorada por git)
  vectordb: data/vectordb               # índice persistente de Chroma (ignorado por git)
  logs: logs                            # logs JSON (*.log ignorados por git)

# --- Datos sintéticos (S3, RNF-11) ---
data:
  seed: 42               # semilla fija para reproducibilidad
  n_tickets: 5000

# --- Chunking de la base de conocimiento ---
chunking:
  strategy: section      # un chunk por sección: síntoma / causa / pasos / escalar
  chunk_size: 800        # máximo de caracteres por chunk si una sección es muy larga
  chunk_overlap: 100     # caracteres compartidos entre chunks consecutivos

# --- Embeddings ---
embeddings:
  provider: fastembed    # fastembed | fake (fake = determinista, para tests y CI)
  # Verificado en T14 con fastembed 0.9.1: modelo soportado, 384 dimensiones, ~250 MB.
  model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  cache_dir: data/vectordb/models   # descarga del modelo (ignorada por git)

# --- Base vectorial ---
vectordb:
  provider: chroma
  collection: deskpilot_kb

# --- Recuperación ---
retrieval:
  top_k: 3                    # artículos máximos por consulta (se piden 4 chunks por artículo)
  # Calibrado en T15 con fastembed real: 20 consultas del dominio (ES/EN) y 8 fuera del
  # dominio contra la KB real. Score del artículo = máxima similitud coseno de sus chunks.
  # Mínimo dentro del dominio 0.428, máximo fuera 0.236 => umbral en el punto medio
  # (0.33, margen ~0.09 a cada lado). Recalibrar si cambia el modelo de embeddings o la KB.
  similarity_threshold: 0.33  # debajo de este valor se responde "no lo sé" (RF-13)
  # RN-03 por artículo (KB-011 caja): escala solo si el artículo obligatorio es el top-1 o su
  # score está a menos de este margen del top-1 ("igual de relevante"). Si no, se descarta de la
  # evidencia (nunca llega al LLM ni se cita). Calibrado con la KB real: los artículos de caja
  # que aparecen como ruido quedan a 0.29-0.33 del top-1 (EV-05/07/09); los vecinos legítimos
  # del top-1 en consultas de dominio suelen estar a >0.14. 0.05 ~ la mitad del margen de
  # ruido del umbral (0.09): empates reales sí escalan, vecinos lejanos no.
  escalation_margin: 0.05

# --- LLM ---
llm:
  provider: none         # none | anthropic | openai | gemini. Se puede sobrescribir con LLM_PROVIDER.
  timeout_s: 30
  models:                # modelo por proveedor (vacío = sin configurar; falla al arrancar si se activa)
    # ID verificado el 2026-11-21 en https://platform.claude.com/docs/en/about-claude/models/overview
    anthropic: claude-sonnet-5-5
    openai: ""           # sin fijar: elige un ID vigente en la doc oficial de OpenAI al activarlo
    gemini: ""           # sin fijar: elige un ID vigente en la doc oficial de Gemini al activarlo

# --- API ---
api:
  host: 127.0.0.1
  port: 8000
  request_timeout_s: 30
  max_query_chars: 500          # longitud máxima de la consulta en buscar_solucion
  max_description_chars: 2000   # longitud máxima de la descripción en crear_ticket
  max_body_bytes: 16384         # tamaño máximo del cuerpo de una petición (413 si lo supera)

# --- Servidor MCP (T18): stdio por defecto (sin red); http exige DESKPILOT_API_KEY ---
mcp:
  transport: stdio
  host: 127.0.0.1
  port: 8001
  path: /mcp

# --- SLA en horas por prioridad (RN-02, ilustrativo) ---
sla_horas:
  P1: 4
  P2: 8
  P3: 24
  P4: 72

# --- Microsoft Fabric (modo fabric) ---
# Solo los NOMBRES de las variables de entorno que se leen; los valores van en .env, nunca aquí.
fabric:
  sql_endpoint_env: FABRIC_SQL_ENDPOINT
  lakehouse_database_env: FABRIC_LAKEHOUSE_DATABASE
  warehouse_endpoint_env: FABRIC_WAREHOUSE_ENDPOINT
  warehouse_database_env: FABRIC_WAREHOUSE_DATABASE
  tenant_id_env: AZURE_TENANT_ID
  client_id_env: AZURE_CLIENT_ID
  client_secret_env: AZURE_CLIENT_SECRET
